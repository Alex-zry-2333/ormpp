name: CI-ThreadSanitizer

on: [push, pull_request]

jobs:
  tsan-test:
    name: TSan (Ubuntu, Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure cmake with ThreadSanitizer
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_THREAD_SANITIZER=ON
          -DENABLE_SANITIZER=OFF

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Debug -j 4

      - name: Test (thread-safety only)
        working-directory: ${{ github.workspace }}/build/tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: './test_ormpp -tc="issue #238*"'
